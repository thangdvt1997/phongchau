name: phongchau

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - phongchau_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional product search backend (see backend/src/modules/search). No host port is
  # published — same convention as postgres/redis above — it's reachable only from
  # other containers on this compose project's internal network. Kept single-node with
  # a small fixed heap on purpose: this VPS is shared with ~20 other docker-compose
  # projects, so memory footprint matters a lot. If this container is down/misconfigured,
  # the backend silently falls back to Postgres `contains` search (OPENSEARCH_ENABLED
  # gates it, and every OpenSearch call in SearchService is try/catch-guarded).
  opensearch:
    image: opensearchproject/opensearch:2
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - phongchau_osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      OPENSEARCH_NODE: http://opensearch:9200
      OPENSEARCH_ENABLED: ${OPENSEARCH_ENABLED:-true}
    volumes:
      - phongchau_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Deliberately NOT health-gated (unlike postgres/redis, which the backend
      # cannot function without): OpenSearch is optional/best-effort by design —
      # if it's ever unhealthy (crashed, OOM-killed on this shared VPS, still
      # starting up), the backend must still start and serve the storefront via
      # the Postgres search fallback. `service_started` only orders container
      # *start*, unlike `service_healthy` which would block on it.
      opensearch:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${NEXT_PUBLIC_GA4_MEASUREMENT_ID}
        NEXT_PUBLIC_GTM_CONTAINER_ID: ${NEXT_PUBLIC_GTM_CONTAINER_ID}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID}
        NEXT_PUBLIC_TIKTOK_PIXEL_ID: ${NEXT_PUBLIC_TIKTOK_PIXEL_ID}
        NEXT_PUBLIC_VIETQR_BANK_BIN: ${NEXT_PUBLIC_VIETQR_BANK_BIN}
        NEXT_PUBLIC_VIETQR_ACCOUNT_NO: ${NEXT_PUBLIC_VIETQR_ACCOUNT_NO}
        NEXT_PUBLIC_VIETQR_ACCOUNT_NAME: ${NEXT_PUBLIC_VIETQR_ACCOUNT_NAME}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_HTTP_PORT:-8730}:80"
    depends_on:
      - frontend
      - backend

volumes:
  phongchau_pgdata:
  phongchau_uploads:
  phongchau_osdata:
