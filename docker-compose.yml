name: phongchau

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phongchau}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-phongchau}
    volumes:
      - phongchau_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phongchau}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional product search backend (see backend/src/modules/search). No host port is
  # published — same convention as postgres/redis above — it's reachable only from
  # other containers on this compose project's internal network. Kept single-node with
  # a small fixed heap on purpose: this VPS is shared with ~20 other docker-compose
  # projects, so memory footprint matters a lot. If this container is down/misconfigured,
  # the backend silently falls back to Postgres `contains` search (OPENSEARCH_ENABLED
  # gates it, and every OpenSearch call in SearchService is try/catch-guarded).
  opensearch:
    image: opensearchproject/opensearch:2
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - phongchau_osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-phongchau}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-phongchau}?schema=public
      REDIS_URL: redis://redis:6379
      OPENSEARCH_NODE: http://opensearch:9200
      OPENSEARCH_ENABLED: ${OPENSEARCH_ENABLED:-true}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - phongchau_uploads:/app/uploads
    ports:
      - "${BACKEND_HOST_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Deliberately NOT health-gated (unlike postgres/redis, which the backend
      # cannot function without): OpenSearch is optional/best-effort by design —
      # if it's ever unhealthy (crashed, OOM-killed on this shared VPS, still
      # starting up), the backend must still start and serve the storefront via
      # the Postgres search fallback. `service_started` only orders container
      # *start*, unlike `service_healthy` which would block on it.
      opensearch:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override .env's NODE_ENV=production (meant for the prod backend image) — `next dev`
      # misbehaves (breaks PostCSS/Tailwind processing) when NODE_ENV isn't "development".
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api/v1}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      - backend

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "${ADMINER_HOST_PORT:-8081}:8080"
    depends_on:
      - postgres

volumes:
  phongchau_pgdata:
  phongchau_uploads:
  phongchau_osdata:
