worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  client_max_body_size 20m;

  # Docker's embedded DNS server. Using it (with variables in proxy_pass below, instead of a
  # static `upstream {}` block) makes nginx re-resolve backend/frontend on every request rather
  # than caching whatever IP they had at nginx's own startup — otherwise redeploying just the
  # backend/frontend containers (recreating them with new IPs) leaves this nginx serving 502s
  # until it's manually restarted too.
  resolver 127.0.0.11 valid=10s;

  server {
    listen 80;

    location /api/ {
      set $backend_upstream backend:4000;
      proxy_pass http://$backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
      set $backend_upstream backend:4000;
      proxy_pass http://$backend_upstream;
    }

    location /sitemap.xml {
      set $backend_upstream backend:4000;
      proxy_pass http://$backend_upstream;
    }

    location /robots.txt {
      set $backend_upstream backend:4000;
      proxy_pass http://$backend_upstream;
    }

    location / {
      set $frontend_upstream frontend:3000;
      proxy_pass http://$frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
